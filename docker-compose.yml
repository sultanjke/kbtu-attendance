services:
  autoscraper:
    build: .
    container_name: kbtu-attendance
    restart: unless-stopped
    init: true
    volumes:
      - type: bind
        source: ./.env
        target: /app/.env
        read_only: true
        bind:
          create_host_path: false
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
